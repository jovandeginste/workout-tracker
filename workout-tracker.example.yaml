# This is the key that signs JWT tokens
jwt_encryption_key: some_long_random_string
# or read the JWT encryption key from a file
jwt_encryption_key_file: /path/to/jwt_encryption_key.txt

# Enables debug output in both the web and database server
debug: false
# Which host and port to bind on
bind: "[::]:80"

# The root path of the web application
web_root: /my-workout-tracker

# Markdown text shown on the login screen
# login_custom_text: |
#   Welcome to this Workout Tracker instance!
#
#   Please contact the administrator for an account.

# LDAP authentication (disabled by default)
# ldap_enabled: true
# ldap_url: ldaps://ldap.example.com:636
# ldap_bind_dn: cn=workout-tracker,ou=services,dc=example,dc=com
# ldap_bind_password_file: /run/secrets/ldap-bind-password
# ldap_base_dn: ou=people,dc=example,dc=com
# ldap_user_filter: "(uid={username})"
# ldap_username_attribute: uid
# ldap_name_attribute: cn
# ldap_required_group: cn=workout-tracker-users,ou=groups,dc=example,dc=com
# ldap_admin_group: cn=workout-tracker-admins,ou=groups,dc=example,dc=com
