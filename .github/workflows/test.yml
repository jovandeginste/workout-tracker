---
name: Test the code

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Vendor dependencies
        run: go mod tidy && go mod vendor

      - name: Check Prettier formatting
        run: PATH="$PWD/frontend/node_modules/.bin:$PATH" make test-assets

      - name: Verify templ files are formatted
        run: make verify-templates

      - name: Update templ files
        run: make build-templates

      - name: Ensure clean
        run: git diff --exit-code

      - name: Run Go tests
        run: go test -v ./...
